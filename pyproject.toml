[project]
name = "riemannian-eeg-mi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "moabb>=1.7.2",
    "pyriemann>=0.12",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riemannian_eeg"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]